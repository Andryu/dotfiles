onboarding = false

[theme]
# Ghostty 側も TokyoNight Night に揃えること（揃えないと外枠と中身が二色に割れる）
# 他の候補: kanagawa / catppuccin。terminal に戻せば Ghostty のパレットをそのまま使う
name = "tokyo-night"

[terminal]
shell_mode = "auto"
new_cwd    = "follow"   # 分割元のディレクトリを引き継ぐ。デフォルトのままだが明示

[keys]
# ── cmux 互換レイアウト ───────────────────────────────────────────
# 日常操作は prefix を使わない。Cmd+X は Ghostty 側で CSI-u（kitty keyboard
# protocol）にエンコードされ、herdr にはここに書いた ctrl+alt+X として届く。
# 対応する送信側は ~/.config/ghostty/config を参照。
# prefix は保険として残す。ctrl+b → ? で実バインド一覧が出る。
prefix = "ctrl+b"

# ── タブ（cmux の surface）──
new_tab    = "ctrl+alt+t"        # Cmd+T
close_tab  = "ctrl+alt+w"        # Cmd+W
rename_tab = "ctrl+alt+r"        # Cmd+R

# ── ペイン ──
split_vertical   = "ctrl+alt+d"  # Cmd+D       右に分割
split_horizontal = "ctrl+alt+shift+d"  # Cmd+Shift+D 下に分割
close_pane       = "ctrl+alt+shift+x"  # Cmd+Shift+X
zoom             = "ctrl+alt+shift+enter"  # Cmd+Shift+Enter
focus_pane_left  = "ctrl+alt+left"    # Opt+Cmd+←
focus_pane_down  = "ctrl+alt+down"    # Opt+Cmd+↓
focus_pane_up    = "ctrl+alt+up"      # Opt+Cmd+↑
focus_pane_right = "ctrl+alt+right"   # Opt+Cmd+→

# ── ワークスペース ──
new_workspace      = "ctrl+alt+n"  # Cmd+N
close_workspace    = "ctrl+alt+shift+w"  # Cmd+Shift+W
rename_workspace   = "ctrl+alt+shift+r"  # Cmd+Shift+R
workspace_picker   = "ctrl+alt+p"  # Cmd+P
switch_workspace   = "ctrl+alt+1..9"    # Cmd+1..9
previous_workspace = "prefix+["
next_workspace     = "prefix+]"

# ── worktree ──
new_worktree    = "ctrl+alt+shift+g"     # Cmd+Shift+G
open_worktree   = "ctrl+alt+g"     # Cmd+G
remove_worktree = "prefix+shift+backspace"

# ── エージェント間の移動。並列運用の実質的な主操作 ──
next_agent     = "ctrl+alt+shift+j"      # Cmd+Shift+J
previous_agent = "ctrl+alt+shift+k"      # Cmd+Shift+K
focus_agent    = "prefix+alt+1..9"

# ── UI ──
toggle_sidebar = "ctrl+alt+b"      # Cmd+B

# Ctrl+1..9 でタブ直行。cmux の ⌃1…9 と同じで、Ghostty 側の変換が不要な唯一の組
[keys.indexed]
tabs = "ctrl"

[[keys.command]]
key = "prefix+alt+g"
type = "popup"
command = "lazygit"      # 未インストール。brew install lazygit してから有効化
width = "90%"
height = "90%"

[worktrees]
directory = "~/Workspace/.worktrees"   # プロジェクト群と同じディスク/近い場所に置く

[ui]
sidebar_start_collapsed = false
hide_tab_bar_when_single_tab = false     # タブ1枚でもタブ行を出す（true にすると1行節約できるが存在が見えなくなる）
show_agent_labels_on_pane_borders = true # どのペインが誰か、枠で分かる
pane_gaps = true
# 選択中ペインの枠・ハイライト・ナビゲーションUIの色。
# tokyo-night の紫（#bb9af7）。Catppuccin 系なら #cba6f7（mauve）
accent = "#bb9af7"

# エージェントパネルを「注意が必要な順」に並べる。
# spaces（=space ごとのグループ）ではなく、blocked / done を上に押し上げる待ち行列
agent_panel_sort = "priority"

mouse_capture = true       # Cmd+クリックでURLを開きたい派なら false
copy_on_select = true

# サイドバーの claude 行に「今何をしているか」を出す。
# terminal_title_stripped は Claude Code が出すタイトルなので、
# 5つ並べた時に「どれが止まってるか」ではなく「どれが何をしてるか」が分かる
[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", "workspace", "tab"], ["agent"]]

[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "workspace", "tab"], ["terminal_title_stripped"], ["agent"]]

[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], ["branch", "git_status"]]

# デフォルトは delivery = "off"。
# バックグラウンドのエージェントが終わったことに気づけないなら多重化の意味がない
[ui.toast]
delivery = "system"
delay_seconds = 1

[ui.sound]
enabled = true

[session]
resume_agents_on_restore = true

[experimental]
# ── ここが日本語環境で効く2つ ──
# IME がオンのままでも ctrl+b（prefix）が通る。
# これが無いと「日本語打ってる最中にペイン移動できない」を毎日踏む
switch_ascii_input_source_in_prefix = true

# Claude Code は自前でカーソルを描くので、macOS の変換候補ウィンドウが
# 画面の隅に取り残される。これを true にすると候補窓がカーソルに追従する
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude"]
cjk_ime_cursor_shape = "steady_block"

# サーバー再起動をまたいでスクロールバックを保持
pane_history = true

[advanced]
scrollback_limit_bytes = 20000000   # エージェントのログは長い。デフォルト10MBは足りない

