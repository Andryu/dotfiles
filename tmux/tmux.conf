# tmux 3.x 用設定
# 普段のエージェント並列運用は cmux / herdr が担当。tmux は SSH 先・保険用

# prefix を C-q に変更
set -g prefix C-q
unbind C-b

# 端末・応答性
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"    # truecolor
set -s escape-time 0                  # ESC の遅延をなくす（vim 用）
set -g history-limit 50000

# 番号基準値
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# マウス操作（tmux 2.1+ は mouse ひとつに統合）
set -g mouse on

# vim のキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# vim のキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# | で縦分割、- で横分割（カレントディレクトリを引き継ぐ）
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# 設定リロード
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# コピーモード（vi キーバインド、y で macOS クリップボードへ）
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"

# ステータスバー
set -g status-style fg=white,bg=black
